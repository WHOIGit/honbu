[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "honbu"
version = "0.1.0.dev0"
description = "Honbu: the shared foundation for config-driven, content-addressed training projects"
readme = "README.md"
authors = [{ name = "Sidney Batchelder", email = "sbatchelder@whoi.edu" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "coolname>=5",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "PyYAML>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
slurm = ["submitit>=1.5"]
optuna = ["optuna>=3.6"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "pymdown-extensions>=10",
]
dev = [
    "honbu[docs]",
    "pytest>=8",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/WHOIGit/honbu"
Repository = "https://github.com/WHOIGit/honbu"

[tool.hatch.build.targets.wheel]
packages = ["src/honbu"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "examples"]
